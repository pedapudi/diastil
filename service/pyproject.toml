[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dia-service"
version = "0.1.0"
description = "Local inference service for the diastil editor (ADK-based). The editor works fully without it."
requires-python = ">=3.11"
dependencies = [
    "google-adk",
    "litellm",
    "fastapi",
    "uvicorn",
    "sse-starlette",
    "python-pptx",
]

[project.optional-dependencies]
# Test-only. The compile suite needs no TeX installation and no model.
dev = ["pytest"]

[project.scripts]
dia = "dia_service.cli:main"
dia-serve = "dia_service.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
# conftest.py holds the fixtures AND the log-fixture path the tests import
pythonpath = ["tests"]
markers = [
    # needs a real TeX engine (the managed tectonic) or real poppler; skips
    # itself when they are absent, so `-m "not integration"` is an
    # optimization, not a requirement
    "integration: exercises a real external binary rather than a stand-in",
]

[tool.setuptools.packages.find]
include = ["dia_service*"]

[tool.setuptools.package-data]
dia_service = ["skills/*.md"]
