# dia service configuration — copy to config.toml and edit.
# The service talks to exactly ONE endpoint family: whatever you configure
# here. Any OpenAI-compatible URL works (hosted APIs, OpenRouter, vLLM,
# LM Studio, Ollama, ...). No telemetry, no other external calls.

[endpoint]
# Base URL of an OpenAI-compatible API.
#   hosted:    https://openrouter.ai/api/v1
#   vllm:      http://localhost:8000/v1
#   ollama:    http://localhost:11434/v1
#   lm studio: http://localhost:1234/v1
base_url = "http://localhost:11434/v1"

# Model id as the endpoint knows it, prefixed for litellm routing.
#   "openai/<model>" works for any OpenAI-compatible server.
model = "openai/qwen2.5-coder:14b"

# Name of the ENVIRONMENT VARIABLE holding the API key (never the key
# itself). Local servers usually accept any value.
api_key_env = "DIA_API_KEY"

# ---- optional per-skill overrides ------------------------------------
# Each skill can route to a different model (heavyweight for translation,
# something fast for repair iterations). Unset fields inherit [endpoint].

# [skills.translate-slide]
# model = "openai/qwen3:32b"

# [skills.repair-fidelity]
# model = "openai/qwen2.5-coder:7b"

# [skills.lift-diagram]
# base_url = "https://openrouter.ai/api/v1"
# model = "openai/some-heavyweight"
# api_key_env = "OPENROUTER_API_KEY"

# [skills.copilot]
# model = "openai/qwen2.5-coder:14b"

# ---- LaTeX compiling (document mode) ---------------------------------
# Unset, the daemon picks the best engine it can find, in this order:
# a tectonic it installed itself, tectonic on PATH, latexmk, xelatex,
# pdflatex. Nothing installed is a supported state — the editor just
# offers to download tectonic (~14MB, into ~/.cache/diastil, no root).

# [tex]
# Pin the engine. A pinned engine that is not installed is reported as
# missing rather than quietly replaced with another one.
# engine = "xelatex"
#
# Seconds before a compile is killed. The default is generous because
# tectonic's FIRST run downloads the packages the document asks for.
# timeout_s = 180

# ---- browser access control (issue #25) ------------------------------
# The daemon binds to 127.0.0.1, but a LOCAL browser page on another
# origin can still reach it, so a CORS allowlist bounds which pages may.
# The default is the Vite dev server on both loopback spellings; the
# editor the CLI serves at /editor is same-origin and needs no entry.

# [service]
# allow_origins = ["http://localhost:5199", "http://127.0.0.1:5199"]
#
# "null" is the origin of a file:// page — the hand-opened standalone
# dist/diastil.html. It is DELIBERATELY not in the default, because it is
# ALSO the opaque origin ANY website mints with <iframe sandbox>: adding
# it lets a drive-by page you visit preflight your /skills/* endpoints and
# spend your model tokens. The standalone editor reads and writes files
# through the browser's file picker, not the daemon, so it does not need
# this. Add "null" only if you specifically want a file:// page to reach
# the model skills, and understand any site can then reach them too:
#   allow_origins = ["http://localhost:5199", "null"]
# The /file and /project/file disk bridges refuse "null" regardless of
# this list — they are CLI-only and the CLI serves the editor same-origin.
#
# Extra Host names /mcp will answer, if you front it with an
# authenticating reverse proxy. Loopback-only by default so a name that
# resolves to 127.0.0.1 cannot DNS-rebind onto it.
# mcp_allow_hosts = ["127.0.0.1", "localhost"]
